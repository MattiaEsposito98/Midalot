<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruota Midalot</title>
<style>
:root{--yellow:#ffc107;--ink:#182033;--muted:#647084;--page:#f7f8fb;--border:#dce5ee;--blue:#2f6fed}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 18px 18px,rgba(255,193,7,.18) 2px,transparent 2px),linear-gradient(90deg,rgba(15,139,141,.06) 1px,transparent 1px),linear-gradient(180deg,rgba(47,111,237,.05) 1px,transparent 1px),var(--page);
  background-size:36px 36px,36px 36px,36px 36px}
header{background:var(--yellow);border-bottom:3px solid var(--ink);box-shadow:0 8px 0 rgba(24,32,51,.08);display:flex;gap:12px;align-items:center;padding:10px 24px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{height:42px;width:42px;object-fit:contain;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px}
.brand b{font-size:22px;font-weight:900;line-height:1}
.brand small{font-size:14px;font-weight:800;opacity:.7;margin-left:4px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 16px;min-height:42px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(24,32,51,.45);font-family:inherit}
.btn:hover{background:#0f1728}
.btn:active{transform:translateY(1px)}
.btn.sec{background:rgba(24,32,51,.12);color:var(--ink);box-shadow:none}
.btn.sec:hover{background:rgba(24,32,51,.2)}
#file{display:none}
#info{width:100%;text-align:center;font-size:14px;font-weight:800;color:var(--muted);padding:14px 0 0}
main{display:flex;gap:28px;padding:8px 20px 28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
#left{display:flex;flex-direction:column;align-items:center}
#wrap{position:relative;width:min(78vmin,600px);aspect-ratio:1;margin-top:14px;filter:drop-shadow(0 14px 34px rgba(24,32,51,.18))}
canvas{width:100%;height:100%}
#ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:36px solid var(--ink);filter:drop-shadow(0 2px 0 var(--yellow))}
#spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);background:var(--yellow);color:var(--ink);font-weight:900;font-size:19px;cursor:pointer;box-shadow:0 4px 0 rgba(24,32,51,.45);font-family:inherit}
#spin:hover:not(:disabled){background:#ffd24a}
#spin:disabled{opacity:.45;cursor:default}
#live{font-size:24px;font-weight:900;height:38px;margin:8px 0 0;color:var(--ink);background:#fff4bf;border:2px solid var(--ink);border-radius:8px;padding:0 18px;line-height:34px;min-width:260px;text-align:center}
#side{width:310px;max-width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 14px 34px rgba(24,32,51,.08);padding:16px;display:flex;flex-direction:column;height:min(78vmin,640px);margin-top:14px}
#side .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.add{display:flex;gap:6px;margin-bottom:8px}
.add #newname{flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid var(--border);font-family:inherit}
.add #newqty{width:56px;padding:9px 6px;border-radius:8px;border:1px solid var(--border);font-family:inherit;text-align:center}
.add .btn{padding:0 14px;min-height:0;font-size:20px}
#search{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;font-family:inherit}
#list{overflow:auto;flex:1;font-size:14px;font-weight:700}
#list div{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--border)}
#list span{color:var(--muted)}
#list #empty{display:block;text-align:center;margin:40px 0;color:var(--muted);border:0}
#modal{position:fixed;inset:0;background:rgba(24,32,51,.6);display:none;align-items:center;justify-content:center;z-index:100}
#box{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:8px;box-shadow:0 8px 0 rgba(24,32,51,.25);padding:28px 36px;text-align:center;max-width:90vw;font-weight:800}
#box .n{font-size:34px;font-weight:900;word-break:break-all;margin:10px 0 18px;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:8px 16px}
#box button{margin:0 6px}
</style></head><body>

lt="logo Midalot"><b>Midalot</b><small>· Ruota</small></div>
  <button class="btn" id="imp">📂 Importa Excel</button>
  <button class="btn sec" id="clr">🗑 Svuota</button>
  <button class="btn sec" id="snd">🔊 Musica</button>
  <input type="file" id="file" accept=".xlsx,.csv,.txt">
</header>
<div id="info">Nessun file caricato</div>
<main>
  <div id="left">
    <div id="live">&nbsp;</div>
    <div id="wrap"><canvas id="c" width="1280" height="1280"></canvas><div id="ptr"></div><button id="spin" disabled>GIRA</button></div>
  </div>
  <div id="side">
    <div class="top"><b id="cnt">Nomi disponibili</b><button class="btn sec" id="mix">🔀 Mischia</button></div>
    <div class="add">
      <input id="newname" placeholder="Aggiungi nome (anche più, separati da virgola)">
      <input id="newqty" type="number" min="1" max="999" value="1" title="Quante volte">
      <button class="btn" id="add">+</button>
    </div>
    <input id="search" placeholder="Cerca un nome...">
    <div id="list"></div>
  </div>
</main>
<div id="modal"><div id="box"><div>Estratto:</div><div class="n" id="win"></div><div>Vuoi levare il vincitore dalla ruota?</div><p><button class="btn" id="si">Sì, levalo</button><button class="btn sec" id="no">No, tienilo</button></p></div></div>
<script>
let TUTTI=[], nomi=[], angle=0, spinning=false, winner=-1, nomeFile='';
const $=id=>document.getElementById(id);
const c=$('c'),x=c.getContext('2d'),R=640;

/* ---------- lettura xlsx senza librerie (zip + inflate nativo del browser) ---------- */
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=u8.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('Non è un file xlsx valido');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
  for(let i=0;i<n;i++){
    const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
    if(!/^xl\/(sharedStrings\.xml|worksheets\/sheet\d+\.xml)$/.test(name))continue;
    const ds=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),data=u8.subarray(ds,ds+csz);
    let txt;
    if(meth===0)txt=new TextDecoder().decode(data);
    else{const s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));txt=await new Response(s).text();}
    out[name]=txt;
  }
  return out;
}
async function leggiXlsx(buf){
  const f=await unzip(buf),dp=new DOMParser(),ss=[];
  if(f['xl/sharedStrings.xml'])dp.parseFromString(f['xl/sharedStrings.xml'],'text/xml').querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')));
  const sheet=f['xl/worksheets/sheet1.xml']||Object.values(f).find(v=>v.includes('<sheetData'));
  if(!sheet)throw new Error('Nessun foglio trovato');
  const out=[];
  dp.parseFromString(sheet,'text/xml').querySelectorAll('c').forEach(cell=>{
    const t=cell.getAttribute('t'),v=cell.querySelector('v');let s='';
    if(t==='s'&&v)s=ss[+v.textContent]||'';
    else if(t==='inlineStr')s=cell.textContent;
    else if(v)s=v.textContent;
    s=s.trim();if(s)out.push(s);
  });
  return out;
}

/* ---------- musichetta (generata dal browser, nessun file audio) ---------- */
let ac=null,muto=false,mTimer=null,mStep=0;
const MELO=[523,659,784,659,880,784,659,587,523,659,784,1047,988,784,659,784]; // Do-Mi-Sol... allegra
function nota(f,d,type,vol){
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
}
function musicaStart(){
  if(muto)return;ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();mStep=0;
  clearInterval(mTimer);
  mTimer=setInterval(()=>{const f=MELO[mStep%MELO.length];nota(f,0.18,'triangle',0.18);if(mStep%4===0)nota(f/4,0.3,'sine',0.2);mStep++;},140);
}
function musicaStop(vittoria){
  clearInterval(mTimer);mTimer=null;
  if(vittoria&&!muto&&ac)[523,659,784,1047].forEach((f,i)=>setTimeout(()=>nota(f,0.6,'triangle',0.22),i*110));
}
$('snd').onclick=()=>{muto=!muto;$('snd').textContent=muto?'🔇 Musica':'🔊 Musica';if(muto)musicaStop(false);};

/* ---------- ruota ---------- */
const COL=['#ffc107','#0f8b8d','#ff6b57','#36a269','#2f6fed'];
function draw(){
  x.clearRect(0,0,2*R,2*R);const n=nomi.length;
  if(!n){x.beginPath();x.arc(R,R,R-6,0,7);x.fillStyle='#2a2756';x.fill();return;}
  const a=2*Math.PI/n;x.save();x.translate(R,R);x.rotate(angle);
  for(let i=0;i<n;i++){x.beginPath();x.moveTo(0,0);x.arc(0,0,R-6,i*a,(i+1)*a+0.002);x.closePath();
    x.fillStyle=COL[i%COL.length];x.fill();}
  if(n<=60){x.font='bold '+Math.max(14,Math.min(30,900/n))+'px sans-serif';x.textAlign='right';x.textBaseline='middle';
    for(let i=0;i<n;i++){x.save();x.rotate((i+.5)*a);x.fillStyle=COL[i%COL.length]==='#ffc107'?'#182033':'#fff';x.fillText(nomi[i].slice(0,22),R-30,0);x.restore();}}
  x.restore();x.beginPath();x.arc(R,R,R-4,0,7);x.lineWidth=10;x.strokeStyle='#182033';x.stroke();
}
function idxAt(){const n=nomi.length,a=2*Math.PI/n;let t=(-Math.PI/2-angle)%(2*Math.PI);if(t<0)t+=2*Math.PI;return Math.min(n-1,Math.floor(t/a));}

/* ---------- elenco ---------- */
function renderList(){
  const q=$('search').value.trim().toLowerCase(),m=new Map();
  nomi.forEach(n=>m.set(n,(m.get(n)||0)+1));
  $('cnt').textContent='Nomi disponibili ('+m.size+')';
  const L=$('list');L.innerHTML='';
  if(!nomi.length){const d=document.createElement('div');d.id='empty';d.textContent=TUTTI.length?'Ruota vuota: hai estratto tutti!':'Importa un file Excel per iniziare';L.appendChild(d);return;}
  const frag=document.createDocumentFragment();
  [...m].filter(([n])=>n.toLowerCase().includes(q)).forEach(([n,k])=>{
    const d=document.createElement('div');d.textContent=n;const s=document.createElement('span');s.textContent='×'+k;d.appendChild(s);frag.appendChild(d);});
  L.appendChild(frag);
}
function aggiorna(){
  $('info').textContent=TUTTI.length?(nomeFile+' · '+nomi.length+' voci nella ruota (su '+TUTTI.length+')'):'Nessun file caricato';
  $('spin').disabled=spinning||!nomi.length;draw();renderList();
}
function mischia(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- eventi ---------- */
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    let lista;
    if(/\.xlsx$/i.test(f.name))lista=await leggiXlsx(await f.arrayBuffer());
    else lista=(await f.text()).split(/[\r\n;,\t]+/).map(s=>s.trim()).filter(Boolean);
    if(!lista.length)throw new Error('Nessun nome trovato nel file');
    TUTTI=lista;nomi=lista.slice();nomeFile=f.name;angle=0;$('live').innerHTML='&nbsp;';aggiorna();
  }catch(err){alert('Errore: '+err.message);}
  e.target.value='';
};
$('clr').onclick=()=>{if(spinning)return;TUTTI=[];nomi=[];nomeFile='';angle=0;$('live').innerHTML='&nbsp;';aggiorna();};
function aggiungi(){
  if(spinning)return;
  const lista=$('newname').value.split(/[;,\n]+/).map(s=>s.trim()).filter(Boolean);
  if(!lista.length)return;
  const q=Math.max(1,Math.min(999,parseInt($('newqty').value)||1));
  lista.forEach(n=>{for(let i=0;i<q;i++){TUTTI.push(n);nomi.push(n);}});
  if(!nomeFile)nomeFile='Elenco manuale';
  $('newname').value='';$('newqty').value=1;$('newname').focus();aggiorna();
}
$('add').onclick=aggiungi;
$('newname').onkeydown=e=>{if(e.key==='Enter')aggiungi();};
$('mix').onclick=()=>{if(spinning)return;mischia(nomi);aggiorna();};
$('search').oninput=renderList;
$('spin').onclick=()=>{
  if(spinning||!nomi.length)return;spinning=true;$('spin').disabled=true;musicaStart();
  const start=angle,tot=(8+Math.random()*4)*2*Math.PI+Math.random()*2*Math.PI,dur=6000,t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);angle=start+tot*e;draw();$('live').textContent=nomi[idxAt()];
    if(p<1)requestAnimationFrame(f);else{musicaStop(true);winner=idxAt();$('win').textContent=nomi[winner];$('modal').style.display='flex';}})(t0);
};
function chiudi(){$('modal').style.display='none';spinning=false;aggiorna();}
// la rimozione avviene SOLO se clicchi "Sì"
$('si').onclick=()=>{const nome=nomi[winner];nomi=nomi.filter(n=>n!==nome);$('live').innerHTML='&nbsp;';chiudi();};
$('no').onclick=chiudi;
aggiorna();
</script></body></html>
